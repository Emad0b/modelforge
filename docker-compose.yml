services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: modelforge
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8100:8100"]
    environment:
      DATABASE_URL: postgresql://modelforge:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/modelforge
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
      MODELFORGE_ADMIN_TOKEN: ${MODELFORGE_ADMIN_TOKEN:-}
    volumes: ["runtime:/runtime"]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
  mlflow:
    build: .
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////runtime/mlflow.db", "--default-artifact-root", "/runtime/artifacts", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--allowed-hosts", "localhost:5000,127.0.0.1:5000,mlflow:5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["runtime:/runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5)"]
      interval: 5s
      retries: 20
  dashboard:
    build: ./frontend
    ports: ["127.0.0.1:5175:80"]
    depends_on: [api]
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "scripts/worker.py"]
    environment:
      DATABASE_URL: postgresql://modelforge:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/modelforge
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
    volumes: ["runtime:/runtime"]
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
volumes:
  database:
  runtime:
